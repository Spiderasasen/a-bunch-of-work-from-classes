<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Search</title>
</head>
<body>
<form id="simpleSearch" method="post" action="https://request-mirror.ohdear.app/post">
    <fieldset id="simpleForm" name="simpleForm">
        <div>
            <label for="username">User Name:</label>
            <input id="username" placeholder="put your username here" type="text" name="user" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input id="password" placeholder="put your password here" type="password" name="pass" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input id="email" placeholder="put your email address here" type="email" name="email" required>
        </div>
        <div>
            <label for="phone">Phone</label>
            <input id="phone" placeholder="put your phone number here" type="number" name="phone">
        </div>
    </fieldset>
    <div>
        <label for="linkden">Linkden: </label>
        <input id="linkden" placeholder="put your linkden link here" type="url" name="link">
    </div>
    <div>
        <label for="birthday">Birthday: </label>
        <input id="birthday" placeholder="put your birthday here" type="date" name="birthday">
    </div>
    <div>
        <label for="age">Age: </label>
        <input id="age" placeholder="put your age here" type="number" name="age">
    </div>
    <div>
        <label for="desired_salary">Desired Salary</label>
        <input id="desired_salary" placeholder="put your desired salary here" type="text" name="desired_salary">
    </div>
    <div>
        <label for="resuem">Upload your Resume</label>
        <input id="resuem" placeholder="put your Resume" type="file" name="resuem">
    </div>
    <input type="reset" value="senior">
    <input type="checkbox" name="Webdev" value="Webdev">
    <input type="checkbox" name="database" value="database">
    <button type="submit">Search</button>
</form>
</body>
</html>
