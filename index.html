<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Education Podcasts</title>
    <link rel="stylesheet" href="css/header.css" type="text/css">
    <style>
        article{
            display: flex;
        }
        .imageContainer{
            display: block;
            unicode-bidi: isolate;
        }
        .imageContainer > .thumbnail{
            width: 250px;
            height: 250px;
            margin: 10px;
        }
        .podcast-title{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .podcast-title h3{
            font-size: xxx-large;
        }
    </style>
</head>
<body>
<header>
    <h1>Top Education Podcasts</h1>
    <h2>2026</h2>
</header>

<main>
    <article>
        <div class="imageContainer">
            <img class="thumbnail" src="images/MindShift-by-KQED-768x768.webp" alt="Mindshift by KQED">
        </div>
        <div class="podcast-title">
            <a href="details/mindshift.html">
                <h3>Mindshift by KQED</h3>
            </a>
        </div>
    </article>
    <article>
        <div class="imageContainer">
            <img class="thumbnail" src="images/Too-Dope-Teachers-and-a-Mic.webp" alt="Too Dope Teachers and a Mic">
        </div>
        <div class="podcast-title">
            <a href="details/todope.html">
                <h3>Too Dope Teachers and a Mic</h3>
            </a>
        </div>
    </article>
    <article>
        <div class="imageContainer">
            <img class="thumbnail" src="images/The-Creative-Classroom.webp" alt="The Creative Classroom">
        </div>
        <div class="podcast-title">
            <h3>The Creative Classroom</h3>
        </div>
    </article>
    <article>
        <div class="imageContainer">
            <img class="thumbnail" src="images/Teachers-on-Fire-with-Tim-Cavey-768x768.webp" alt="Teachers on Fire with Tim Cavey">
        </div>
        <div class="podcast-title">
            <h3>Teachers on Fire With Time Kavey</h3>
        </div>
    </article>
    <article>
        <div class="imageContainer">
            <img class="thumbnail" src="images/Teachers-Off-Duty-768x768.webp" alt="Teachers Off Duty 768">
        </div>
        <div class="podcast-title">
            <h3>Teachers Off Duty</h3>
        </div>
    </article>
</main>
</body>
</html>
